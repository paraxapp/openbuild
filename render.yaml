services:
  - type: web
    name: openbuild-app
    runtime: node
    repo: https://github.com/paraxapp/openbuild.git
    branch: main
    buildCommand: npm run install:all && npm run build
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
